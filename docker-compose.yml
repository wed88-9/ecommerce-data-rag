services:

  # ============================================================
  # Kafka
  # ============================================================

  kafka:
    image: apache/kafka:3.9.1
    container_name: ecommerce-kafka

    ports:
      - "9092:9092"

    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller

      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092

      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT

      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1

      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3


    # ============================================================
  # Python / Spark Application
  # ============================================================

  python:
    build:
      context: .

    container_name: ecommerce-python

    working_dir: /app

    volumes:
      - .:/app

    depends_on:
      - kafka

    command:
      - tail
      - -f
      - /dev/null
  # ============================================================
  # Airflow Database
  # ============================================================

  postgres:
    image: postgres:16

    container_name: ecommerce-airflow-postgres

    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow

    volumes:
      - airflow-postgres-data:/var/lib/postgresql/data


  # ============================================================
  # Airflow Initialization
  # ============================================================

  airflow-init:
    build:
      context: ./airflow

    container_name: ecommerce-airflow-init

    depends_on:
      - postgres

    environment:
      AIRFLOW__WEBSERVER__SECRET_KEY: "ecommerce-data-rag-secret-key"

      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: "postgresql+psycopg2://airflow:airflow@postgres:5432/airflow"

      AIRFLOW__CORE__EXECUTOR: LocalExecutor

      AIRFLOW__CORE__LOAD_EXAMPLES: "false"

      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "false"

    volumes:
      - ./dags:/opt/airflow/dags
      - ./:/app
      - /var/run/docker.sock:/var/run/docker.sock

    command:
      - bash
      - -c
      - |
        airflow db migrate
        airflow users create \
          --username admin \
          --password admin \
          --firstname Admin \
          --lastname User \
          --role Admin \
          --email admin@example.com || true


  # ============================================================
  # Airflow Webserver
  # ============================================================

  airflow-webserver:
    build:
      context: ./airflow

    container_name: ecommerce-airflow-webserver

    depends_on:
      - postgres
      - airflow-init

    environment:
      AIRFLOW__WEBSERVER__SECRET_KEY: "ecommerce-data-rag-secret-key"

      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: "postgresql+psycopg2://airflow:airflow@postgres:5432/airflow"

      AIRFLOW__CORE__EXECUTOR: LocalExecutor

      AIRFLOW__CORE__LOAD_EXAMPLES: "false"

      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "false"

    ports:
      - "8080:8080"

    volumes:
      - ./dags:/opt/airflow/dags
      - ./:/app
      - /var/run/docker.sock:/var/run/docker.sock

    command:
      - airflow
      - webserver


  # ============================================================
  # Airflow Scheduler
  # ============================================================

  airflow-scheduler:
    build:
      context: ./airflow

    container_name: ecommerce-airflow-scheduler

    depends_on:
      - postgres
      - airflow-init

    environment:
      AIRFLOW__WEBSERVER__SECRET_KEY: "ecommerce-data-rag-secret-key"

      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: "postgresql+psycopg2://airflow:airflow@postgres:5432/airflow"

      AIRFLOW__CORE__EXECUTOR: LocalExecutor

      AIRFLOW__CORE__LOAD_EXAMPLES: "false"

      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "false"

    volumes:
      - ./dags:/opt/airflow/dags
      - ./:/app
      - /var/run/docker.sock:/var/run/docker.sock

    command:
      - airflow
      - scheduler


# ==============================================================
# Volumes
# ==============================================================

volumes:
  airflow-postgres-data: